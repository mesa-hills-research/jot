[package]
name = "jot"
version = "0.1.0"
edition = "2024"
authors = ["Jot Contributors"]
description = "A modern, cross-platform text editor built with GPUI"
license = "MIT"
repository = "https://github.com/jot-editor/jot"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# GPUI Kit from Mesa Hills Research's fork. It pins the matching gpui-pre release
# and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of its own.
# With `tree-sitter` the kit reads the `highlight` section of jot's themes: the
# editor colours and the error colour of the spelling underlines. Without it
# the kit ignores that section.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "58718fa85650a32e12296c2bd8a60810d0e7990c", features = ["tree-sitter"] }
anyhow = "1.0"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
dirs = "5.0"
chrono = "0.4"
lsp-types = "0.97"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# GPUI's layout, text and drawing crates are slow unoptimized. Optimizing them
# keeps debug builds responsive while jot's own code stays quick to build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
