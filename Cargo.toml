[package]
name = "jot"
version = "0.1.0"
edition = "2024"
authors = ["Jot Contributors"]
description = "A modern, cross-platform text editor built with GPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/jot"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# GPUI Kit from Mesa Hills Research's fork, published as mhr-gpui-kit. It pins the matching mhr-gpui release
# and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of its own. Its
# `writing` feature brings the spell checker and the word suggestions, and its
# `fonts` feature embeds Work Sans and JetBrains Mono as variable fonts, the
# interface and editor fonts.
gpui-kit = { package = "mhr-gpui-kit", version = "=0.7.2", features = ["writing", "fonts"] }
anyhow = "1.0"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
dirs = "5.0"
chrono = "0.4"
# Hands a later launch's files to the running jot's windows. GPUI depends on
# it already.
async-channel = "2"

# Single instance: the user's id, for the socket's folder. GPUI depends on it
# already.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Single instance: the named pipe. Shell integration: telling File Explorer
# that Open with changed. At the version and with features GPUI already
# builds it with.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Shell integration: Open with's registry keys. GPUI depends on it already.
windows-registry = "0.6"

[dev-dependencies]
# The same GPUI Kit, with GPUI's test harness for tests that type into a real
# text editor on a fake clock.
gpui-kit = { package = "mhr-gpui-kit", version = "=0.7.2", features = ["writing", "fonts", "test-support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# GPUI's layout, text and drawing crates are slow unoptimized. Optimizing them
# keeps debug builds responsive while jot's own code stays quick to build.
[profile.dev.package]
mhr-gpui = { opt-level = 3 }
mhr-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
